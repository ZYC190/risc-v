# Safety overrides used only while manually driving during SLAM.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Driver source + laser yaw=pi show the 90-270 crop masks the robot-rear
    # half-plane.  Reverse and lateral motion are therefore hard-disabled;
    # the operator maps by slow forward motion and in-place turns only.
    max_velocity: [0.15, 0.0, 0.35]
    min_velocity: [0.0, 0.0, -0.35]
    max_accel: [0.60, 0.0, 1.00]
    max_decel: [-0.80, 0.0, -1.00]
    odom_topic: /odom_combined
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom_combined"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["FootprintApproach", "PolygonSlow"]
    # During pure SLAM there is no local_costmap/published_footprint.  Use a
    # static circle enclosing the 0.270 m x 0.222 m chassis instead.
    FootprintApproach:
      type: "circle"
      radius: 0.22
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 3
      visualize: true
      polygon_pub_topic: "mapping_footprint_approach"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: [0.45, 0.26, 0.45, -0.26, -0.30, -0.26, -0.30, 0.26]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.75
      visualize: true
      polygon_pub_topic: "mapping_polygon_slowdown"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
