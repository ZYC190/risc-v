amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.20  #保留麦克纳姆轮打滑余量，同时避免相似直墙中粒子过度扩散
    alpha2: 0.15  #降低直行时不必要的朝向扩散
    alpha3: 0.2  #里程计的翻译估计中来自translation的预期过程噪声
    alpha4: 0.25 #降低转弯后的粒子云漂移
    alpha5: 0.2  #仅适用于 Omni 型号：translation噪音
    base_frame_id: "base_footprint" #机器人底座框架 
    introspection_mode: "disabled" #启用调试模式，这将发布额外的调试信息 
    beam_skip_distance: 0.5         #忽略似然场模型中大多数粒子不同意的光束。考虑跳过的最大距离（米）
    beam_skip_error_threshold: 0.9  #由于收敛性不好，未匹配地图后强制进行完全更新的光束百分比
    beam_skip_threshold: 0.3        #需要跳过的光束的百分比。
    do_beamskip: false              #比赛围挡静态，保留全部墙面特征以区分相似区域
    global_frame_id: "map"          #定位系统发布的坐标框架的名称
    lambda_short: 0.1               #模型 z_short 部分的指数衰减参数
    laser_likelihood_max_dist: 1.0  #小场地提高近墙匹配分辨率
    laser_max_range: 6.0            #覆盖比赛场地，同时排除场外远距离回波
    laser_min_range: 0.15           #与雷达上报的range_min一致，忽略机身近距自反射
    laser_model_type: "likelihood_field_prob" #启用带波束跳过的似然场模型
    #beam、likelihood_field 或 unlikely_field_prob。与 unlikely_field 相同，但如果启用，则包含 beamskip 功能
    max_beams: 80                   #小比赛地图保留足够墙面特征，同时避免激光回调积压
    max_particles: 1600            #限制粒子峰值，为控制器和TF线程保留实时余量
    min_particles: 400             #兼顾相似围挡定位与板端计算负载
    odom_frame_id: "odom_combined"  #使用哪个框架进行里程计
    pf_err: 0.05                    #粒子过滤器群体误差
    pf_z: 0.99                      #粒子过滤器群体密度
    recovery_alpha_fast: 0.0        #快速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    recovery_alpha_slow: 0.0        #慢速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    resample_interval: 1            #每次滤波更新后重采样，及时吸收激光匹配结果
    robot_model_type: "nav2_amcl::OmniMotionModel" #插件类的完全限定类型。
    #选项为“nav2_amcl::DifferentialMotionModel”和“nav2_amcl::OmniMotionModel”。

    save_pose_rate: 0.5             #将最后估计的姿势和协方差存储到参数服务器的最大速率（Hz）
    sigma_hit: 0.10                #收紧激光命中分布，提高薄围挡地图匹配精度
    tf_broadcast: true              #将其设置为 false 以防止 amcl 发布全局框架和里程计框架之间的变换
    transform_tolerance: 0.5        #减少地图姿态显示的时间滞后
    update_min_a: 0.05             #约2.9度更新一次，避免原地微抖反复触发粒子滤波
    update_min_d: 0.05             #与地图5厘米分辨率一致，减少重复定位计算
    z_hit: 0.85                     #提高静态围挡命中权重
    z_max: 0.001                    #模型的 z_max 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_rand: 0.10                    #保留少量随机回波容错
    z_short: 0.049                  #降低人员短回波对定位的拉动
    scan_topic: scan                #要订阅的激光雷达

    # Initial Pose
    set_initial_pose: True #AMCL 从 initial_pose* 参数设置初始姿势，而不是等待 initial_pose 消息
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    #Amcl参数解释参考：https://docs.nav2.org/configuration/packages/configuring-amcl.html

amcl_map_client:
  ros__parameters:
    use_sim_time: False

# 板端同时运行地图、控制、桥接等节点时，偶尔会有数秒调度抖动。
# 默认 4 秒 bond 超时会误判服务死亡并关闭整套导航。
lifecycle_manager_localization:
  ros__parameters:
    bond_timeout: 15.0

lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 15.0

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.3 #变换容差
    goal_reached_tol: 0.10 #接受姿势作为目标的容忍度(m)
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    # RPLIDAR C1 屏蔽车尾，禁止默认 BT 调用 Spin/BackUp。使用只包含
    # 清图和短等待的安全行为树，否则 bt_navigator 会因缺少 spin action
    # 在 lifecycle 配置阶段失败，并拒绝所有导航目标。
    default_nav_to_pose_bt_xml: "/home/zyc/robot2/src/wheeltec_robot_nav2/param/wheeltec_params/navigate_to_pose_safe.xml"
    default_nav_through_poses_bt_xml: "/home/zyc/robot2/src/wheeltec_robot_nav2/param/wheeltec_params/navigate_through_poses_safe.xml"
    bt_loop_duration: 100       #板载运行使用10Hz BT，减少与控制器争抢CPU
    default_server_timeout: 500 #BT 操作节点等待操作服务器确认时的默认超时值（以毫秒为单位）
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    #plugin_lib_names: #行为树节点共享库列表，Humble后的版本默认包含所有NAV2 BT库，这里可以加入自定义BT节点
    error_code_names:
    - compute_path_error_code 
    - follow_path_error_code

# bt_navigator参数说明：https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html?highlight=bt_navigator

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 8.0            #与10Hz里程计错峰，降低板端调度抖动和TF向未来外推失败
    # min_x_velocity_threshold: 0.001      #最小 x 速度阈值
    # min_y_velocity_threshold: 0.5        #最小 y 速度阈值
    # min_theta_velocity_threshold: 0.001  #最小速度阈值
    odom_topic: /odom_combined
    failure_tolerance: 1.5 #容忍短时TF/调度抖动，避免立刻清图、旋转恢复而拖慢导航
    progress_checker_plugin: "progress_checker" #进度检查器，用于检查机器人进度的进度检查器插件的映射名称
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker" #目标检查器
    controller_plugins: ["FollowPath"]    #控制器插件

    # Progress checker parameters
    progress_checker: #进度检查器
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05 #小幅有效前进也算进展，减少近目标处反复恢复
      required_movement_angle: 0.15 #原地转向约9度也算进展，避免把正常对正误判为卡死
      movement_time_allowance: 8.0 #8秒无位移/转角进展就清图恢复，避免比赛现场原地等15秒一轮
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker: #目标检查器
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25  #家庭巡查无需贴墙收敛，避免临近目标反复微调
      yaw_goal_tolerance: 3.14 #巡查只要求到达位置，不强制原地旋转到目标朝向
    # 轻量 MPPI：短预测窗和小批量适配板端，独立激光防撞继续兜底。
    FollowPath: 
      plugin: "nav2_mppi_controller::MPPIController"
      desired_linear_vel: 0.32          #直线路段适度提速，强制停车仍由collision monitor保证
      lookahead_dist: 0.30              #缩短前视，避免在直角内墙处切弯
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.48
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.9 #外层0.30m激光急停兜底，避免直角路径过度预判碰撞
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.16 #避免RPP与防撞减速叠加后只剩约0.045m/s
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.20           #仅在真正靠近墙体时进入低速
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true       #大角度先原地对正，避免一边前进一边扫到围挡
      rotate_to_heading_angular_vel: 0.50
      rotate_to_heading_min_angle: 0.75
      max_angular_accel: 1.0
      allow_reversing: false
    
      time_steps: 18    #2.25秒预测范围，兼顾转角预判与板端计算量
      model_dt: 0.125   #与8Hz控制周期一致
      batch_size: 250   #轻量采样，避免控制循环因算力不足而丢周期
      vx_std: 0.12
      vy_std: 0.0       #导航禁用横移采样，避免地图斜移而实车主要前进
      wz_std: 0.35
      vx_max: 0.30
      vx_min: 0.0       #后向激光被屏蔽，导航和恢复均禁止倒车
      vy_max: 0.0        #导航只允许先转向再前进；手机手动横移不受影响
      wz_max: 0.70      #加快路径起步转向，仍低于速度平滑器0.8 rad/s上限
      ax_max: 0.6
      ax_min: -0.8
      ay_max: 0.0
      az_max: 1.0
      iteration_count: 1 #迭代次数
      prune_distance: 0.8 #小地图只保留近处路径，减少无效计算
      enforce_path_inversion: false
      transform_tolerance: 0.5 #兼容板端短时调度抖动
      temperature: 0.3 #根据成本选择轨迹，0表示使用成本最佳的控制，巨大的值将导致仅取所有轨迹的平均值而不考虑成本。
      gamma: 0.015 #平滑度（高）和低能耗（低）之间的权衡,保持默认值
      motion_model: "DiffDrive" #比赛导航采用先转向再前进，减少麦克纳姆横移打滑和定位偏差
      visualize: false #是否发布调试轨迹以供可视化。
      TrajectoryVisualizer: #轨迹可视化
        trajectory_step: 5 #轨迹之间的步骤可视化以对候选轨迹池进行下采样
        time_step: 3 #轨迹上点之间的步骤可视化以降低轨迹密度的采样
      AckermannConstraints:
        min_turning_r: 0.25 #最小转弯半径（阿克曼运动模型）
      regenerate_noises: false
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic: #修复超出设定的动态或运动学约束的轨迹
        enabled: true
        cost_power: 1 
        cost_weight: 4.0  #权重参数
      
      GoalAngleCritic: #当距离目标较近时，GoalAngleCritic会激励导航以达到目标姿势的角度
        enabled: true
        cost_power: 1
        cost_weight: 3.0 #权重参数
        threshold_to_consider: 0.5  #考虑阈值：机器人与目标之间的最小距离（米），超过此距离则考虑角度目标成本

      GoalCritic: #当距离目标较近时，GoalCritic会激励机器人在空间上向目标导航
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # 1.4m 内启用朝目标推进；PathFollowCritic 持续到 0.40m，
        # 两者在近目标区间重叠，绕障时不会过早丢失全局路径约束。
        threshold_to_consider: 1.4

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 30.0 #应用于临界碰撞的权重，用于collision_margin_distance防止近距离碰撞
        consider_footprint: true  #按真实矩形车体检查碰撞，避免机器人中心进入墙体后才停车
        collision_cost: 10000.0 #应用于轨迹中真实碰撞的成本。
        collision_margin_distance: 0.08
        near_goal_distance: 0.40
        cost_scaling_factor: 3.0
        inflation_radius: 0.28

      PreferForwardCritic: #激励机器人前进，而不是后退
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5 #机器人与目标之间的距离（米）停止考虑前锋并允许目标批评家接管。
      # Option to replace Cost and use Obstacles instead

      PathAlignCritic:  #PathAlignCritic会激励机器人与全局路径保持一致。它不实现路径跟随行为。
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07 #最大路径占用率
        trajectory_point_step: 4
        threshold_to_consider: 0.5 #机器人与目标之间的距离阈值，阈值符合则停止考虑路径对齐并允许目标批评家接管。
        offset_from_furthest: 20 #最远偏移量
        use_path_orientations: false #是否在路径对齐中考虑路径的方向

      PathAngleCritic: #路径角度评论，机器人在因累积角度误差较大而需要时进行急转弯。
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4 #最远偏移量，任何轨迹达到最远路径点之后的路径点数，用于计算相对于的路径角度。
        threshold_to_consider: 0.5 #机器人与目标之间的距离阈值，阈值符合允许目标批评家接管。
        max_angle_to_furthest: 1.0 #机器人与目标之间的角距离
        mode: 0

      PathFollowCritic: #路径跟随评论家激励机器人沿着路径前进。
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 0.40 #0.4~1.4m同时沿全局路径并朝目标推进，避免绕挡块时被直拉卡住
#参数参考：https://docs.nav2.org/configuration/packages/configuring-mppic.html


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 4.0  #10Hz雷达下4Hz足够，为MPPI和AMCL保留实时余量
      publish_frequency: 1.0 #手机巡查不需要高频发布完整代价地图
      global_frame: odom_combined #滚动局部地图使用连续里程计坐标，避免AMCL修正时整张局部地图跳动
      robot_base_frame: base_footprint #机器人底座框架
      transform_tolerance: 0.5 #允许板载计算抖动时使用稍晚到达的TF
      use_sim_time: False  #仿真时间
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 3             #代价地图的宽度（m）
      height: 3            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      #robot_radius: 0.20   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[ [-0.1350, -0.1110], [-0.1350, 0.1110], [0.1350, 0.1110], [0.1350, -0.1110] ]"
      plugins: ["obstacle_layer","inflation_layer"] #单线雷达使用2D障碍层，降低板端CPU占用
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 3.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.28                     #保留原安全膨胀距离；窄口由路径评分与快速恢复解决
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   #2D激光无需维护3D体素网格
        enabled: True
        footprint_clearing_enabled: True            #始终清除车体自身占用，避免把机器人困在障碍格中
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        observation_sources: scan                       #当前仅/scan有发布者，避免订阅空的/scan2
        scan:
          topic: /scan
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.15                  #忽略雷达有效量程内的机身自反射
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0                  #可检测障碍物的最大高度（米）
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          data_type: "LaserScan"                    #数据类型
          raytrace_max_range: 10.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                   #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                   #控制代价地图上标记障碍物的最小范围
          
      always_send_full_costmap: False                #只发送更新区域以降低CPU和带宽占用
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0             #成本地图更新频率
      publish_frequency: 1.0            #将成本图发布到话题的频率
      global_frame: map                 #全局框架
      robot_base_frame: base_footprint  #机器人底座框架
      transform_tolerance: 0.5          #兼容雷达与TF约十几毫秒的时间差
      use_sim_time: False               #仿真时间 
      #robot_radius: 0.20                #机器人半径
      footprint: "[ [-0.1350, -0.1110], [-0.1350, 0.1110], [0.1350, 0.1110], [0.1350, -0.1110] ]"
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        footprint_clearing_enabled: True            #动态障碍层不在机器人足迹内保留障碍
        observation_sources: scan                   #当前仅/scan有发布者
        scan:
          topic: /scan
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.15                 #忽略雷达有效量程内的机身自反射
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0                 #可检测障碍物的最大高度（米）
          clearing: True                           #是否启用障碍物清除功能
          marking: True                            #是否启用障碍物标记功能
          data_type: "LaserScan"                   #数据类型
          raytrace_max_range: 10.0                 #控制光线追踪从代价地图中清除障碍物的最大范围 
          raytrace_min_range: 0.0                  #控制光线追踪从代价地图中清除障碍物的最大范围 
          obstacle_max_range: 2.5                  #控制代价地图上标记障碍物的最大范围
          obstacle_min_range: 0.0                  #控制代价地图上标记障碍物的最小范围
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 4.0                    #更早远离墙面，又不封死窄通道
        inflation_radius: 0.28                     #与局部代价地图保持一致
      always_send_full_costmap: False              #只发送更新区域以降低CPU和带宽占用
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "WHEELTEC.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置


planner_server: #规划器服务器参数
  ros__parameters:
    expected_planner_frequency: 1.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    use_sim_time: False
    planner_plugins: ["GridBased"] #规划器插件类型，需要与BT Tree文件匹配
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true
      use_final_approach_orientation: False


planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1  #TF transform tolerance.
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    # BEGIN CODEX NO-REVERSE BEHAVIORS
    # Rear lidar coverage is masked; do not load BackUp, DriveOnHeading,
    # or Spin recovery actions. Normal controller heading changes remain.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    # END CODEX NO-REVERSE BEHAVIORS

# behavior_server reference:
#   ros__parameters:
#     costmap_topic: local_costmap/costmap_raw           #用于在局部代价地图上进行碰撞检查的原始代价地图主题。
#     footprint_topic: local_costmap/published_footprint #局部代价地图框架中的足迹主题。
#     cycle_frequency: 10.0 #运行行为插件的频率。
#     behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] #插件包括：{“旋转”、“后退”、“前进”、“等待”}
#     spin:
#       plugin: "nav2_behaviors/Spin"
#     backup:
#       plugin: "nav2_behaviors/BackUp"
