#     max_rotational_vel: 0.3  #最大旋转速度（弧度/秒）
#     min_rotational_vel: 0.05 #最小旋转速度（弧度/秒）
#     rotational_acc_lim: 0.3  #最大旋转加速度（rad/s^2）

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.32, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -1.0]  # RPLIDAR rear half-plane is masked: never reverse  # RPLIDAR rear half-plane is masked: never reverse  # RPLIDAR rear half-plane is masked: never reverse
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: /odom_combined
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3  #控制器或TF卡住时，300ms内自动输出零速度

# 独立于地图和 AMCL 的最后一道激光安全门。
# 使用按速度预测碰撞的 approach 模式：朝障碍运动时减速/停车，
# 远离障碍的低速转向仍可执行；后退由控制器和速度平滑器共同禁用。
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom_combined"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 1.0
    polygons: ["FootprintApproach", "PolygonSlow"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.80  #0.30m/s时预测约0.24m，提前柔性限速并支持安全脱困
      simulation_time_step: 0.05
      max_points: 3
      visualize: True
      polygon_pub_topic: "footprint_approach"
      enabled: True
    PolygonSlow:
      type: "polygon"
      points: [0.45, 0.23, 0.45, -0.23, -0.23, -0.23, -0.23, 0.23]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.75  #外层只减速不锁死；真正碰撞风险由FootprintApproach处理
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20 #循环速率
    stop_on_failure: false #如果单个航点失败，是否使操作任务失败。如果为 false，将继续到下一个航点。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 #机器人到达每个航点后休眠/等待的时间（以毫秒为单位）
#waypoint_follower 参数参考
#https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html?highlight=stop_on_failure
